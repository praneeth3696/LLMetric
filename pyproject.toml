[project]
name = "llmetrics"
version = "1.0.0"
description = "A cost, latency, and reliability monitor for applications calling LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["core/tests", "backend/tests"]
